services:
  - type: web
    name: self-healing-rag-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: FAISS_INDEX_PATH
        value: storage/faiss_index
      - key: DOCUMENTS_DIR
        value: storage/documents
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K
        value: "4"
      - key: MAX_RETRIES
        value: "3"
    disk:
      name: rag-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
